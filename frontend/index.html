<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlastDaemon | Professional Engineering Workspace</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="app-container">
        <!-- Outliner Sidebar -->
        <aside id="left-sidebar" class="panel">
            <div class="panel-header">Outliner</div>
            <div class="panel-content">
                <ul id="outliner">
                    <!-- Populated by main.ts -->
                </ul>
            </div>
        </aside>

        <!-- Node Graph Viewport -->
        <main id="center-viewport" class="panel">
            <div class="panel-header">
                <span>Node Graph</span>
                <div class="header-actions">
                    <button id="auto-arrange-btn" class="header-button secondary">Auto-Arrange</button>
                    <button id="run-simulation-btn" class="header-button">Run Simulation</button>
                </div>
            </div>
            <div id="graph-viewport" class="panel-content" style="overflow: hidden; cursor: crosshair;">
                <div id="canvas-container">
                    <svg id="edge-svg" style="position: absolute; top: 0; left: 0; width: 10000px; height: 10000px; pointer-events: none;">
                        <!-- Edges rendered here -->
                    </svg>
                    <!-- Nodes rendered here as DOM elements -->
                </div>
            </div>
        </main>

        <!-- Telemetry & Properties Sidebar -->
        <aside id="right-sidebar" class="panel">
            <div class="panel-header">Live Telemetry</div>
            <div id="telemetry-container" class="panel-content" style="flex-grow: 0; height: 200px; border-bottom: 1px solid var(--border-color);">
                <canvas id="telemetry-canvas"></canvas>
            </div>
            <div class="panel-header">Property Editor</div>
            <div id="property-editor-container" class="panel-content">
                <!-- Populated by PropertyEditor.ts -->
                <div style="padding: 20px; color: #666;">No node selected</div>
            </div>
        </aside>

        <!-- Command & Log Panel -->
        <footer id="bottom-panel" class="panel">
            <div class="panel-header">Bottom Terminal</div>
            <div id="terminal-output" class="panel-content terminal-content"></div>
        </footer>
    </div>
    <!-- <script type="module" src="dist/main.js"></script> -->
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
