<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-label="FEM 3D Element Topologies and Integration Formulations">
  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .title { font: 700 15px "Segoe UI", system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 600 12px "Segoe UI", system-ui, sans-serif; fill: #334155; }
      .label { font: 500 11px "Segoe UI", system-ui, sans-serif; fill: #1e293b; }
      .small { font: 400 10px "Segoe UI", system-ui, sans-serif; fill: #475569; }
      .mono { font: 500 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0f172a; }
      .axis { stroke: #334155; stroke-width: 1.2; }
      .grid { stroke: #e2e8f0; stroke-width: 0.8; stroke-dasharray: 3 3; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect class="bg" x="1" y="1" width="818" height="298" rx="8"/>

  <text class="title" x="24" y="28">Lagrangian 3D FEM Element Library &amp; Locking / Hourglass Formulations</text>
  <rect class="panel" x="20" y="46" width="180" height="234" rx="6"/>
  <text class="subtitle" x="32" y="68">Hex8 (SRI / B-bar / FB)</text>
  <text class="small" x="32" y="246">8 nodes | 1-pt FB/KF or 8-pt SRI</text>
  <text class="small" x="32" y="262">No volumetric locking (B-bar)</text>
  <rect class="panel" x="220" y="46" width="180" height="234" rx="6"/>
  <text class="subtitle" x="232" y="68">Tet4-ANP</text>
  <text class="small" x="232" y="246">4 nodes | Avg Nodal Pressure</text>
  <text class="small" x="232" y="262">Bonet-Burton smoothed J_nodal</text>
  <rect class="panel" x="420" y="46" width="180" height="234" rx="6"/>
  <text class="subtitle" x="432" y="68">Wedge6 &amp; Pyramid5</text>
  <text class="small" x="432" y="246">6 / 5 nodes | Hex-Tet transition</text>
  <text class="small" x="432" y="262">2-pt Gauss / Dual-Tet split</text>
  <rect class="panel" x="620" y="46" width="180" height="234" rx="6"/>
  <text class="subtitle" x="632" y="68">Shell4BT &amp; CZM8</text>
  <text class="small" x="632" y="246">4-node Co-Rotational / 8-node CZM</text>
  <text class="small" x="632" y="262">Simpson layers + Option C split</text>
  <polygon points="65,120 135,120 135,190 65,190" fill="#eff6ff" fill-opacity="0.5" stroke="#2563eb" stroke-width="1.6"/>
  <polygon points="90,95 160,95 160,165 90,165" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="3 2"/>
  <line x1="65" y1="120" x2="90" y2="95" stroke="#2563eb" stroke-width="1.3"/>
  <line x1="135" y1="120" x2="160" y2="95" stroke="#2563eb" stroke-width="1.3"/>
  <line x1="135" y1="190" x2="160" y2="165" stroke="#2563eb" stroke-width="1.3"/>
  <line x1="65" y1="190" x2="90" y2="165" stroke="#2563eb" stroke-width="1.3"/>
  <circle cx="112" cy="142" r="4.5" fill="#dc2626"/>
  <text class="small" x="120" y="146" fill="#dc2626">GP</text>
  <polygon points="260,195 355,195 310,100" fill="#f0fdf4" fill-opacity="0.6" stroke="#16a34a" stroke-width="1.6"/>
  <line x1="260" y1="195" x2="325" y2="165" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3 2"/>
  <line x1="355" y1="195" x2="325" y2="165" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3 2"/>
  <line x1="310" y1="100" x2="325" y2="165" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3 2"/>
  <circle cx="260" cy="195" r="4" fill="#16a34a"/>
  <circle cx="355" cy="195" r="4" fill="#16a34a"/>
  <circle cx="310" cy="100" r="4" fill="#16a34a"/>
  <circle cx="325" cy="165" r="4" fill="#16a34a"/>
  <polygon points="465,195 545,195 505,155" fill="#faf5ff" fill-opacity="0.6" stroke="#9333ea" stroke-width="1.5"/>
  <polygon points="465,125 545,125 505,85" fill="#faf5ff" fill-opacity="0.4" stroke="#9333ea" stroke-width="1.5"/>
  <line x1="465" y1="195" x2="465" y2="125" stroke="#9333ea" stroke-width="1.4"/>
  <line x1="545" y1="195" x2="545" y2="125" stroke="#9333ea" stroke-width="1.4"/>
  <line x1="505" y1="155" x2="505" y2="85" stroke="#9333ea" stroke-width="1.4"/>
  <polygon points="650,175 725,185 765,135 690,125" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <line x1="708" y1="155" x2="708" y2="105" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <line x1="708" y1="155" x2="748" y2="160" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <text class="small" x="714" y="112" fill="#dc2626">e3 (n)</text>
  <text class="small" x="750" y="164" fill="#2563eb">e1</text>
</svg>
