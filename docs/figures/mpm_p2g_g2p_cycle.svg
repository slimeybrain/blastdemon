<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="820" height="320" role="img" aria-label="MPM P2G-Grid-G2P Symplectic Cycle and Shape Functions">
  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .title { font: 700 15px "Segoe UI", system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 600 12px "Segoe UI", system-ui, sans-serif; fill: #334155; }
      .label { font: 500 11px "Segoe UI", system-ui, sans-serif; fill: #1e293b; }
      .small { font: 400 10px "Segoe UI", system-ui, sans-serif; fill: #475569; }
      .mono { font: 500 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0f172a; }
      .axis { stroke: #334155; stroke-width: 1.2; }
      .grid { stroke: #e2e8f0; stroke-width: 0.8; stroke-dasharray: 3 3; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect class="bg" x="1" y="1" width="818" height="318" rx="8"/>

  <text class="title" x="24" y="28">Material Point Method (MPM): Symplectic Step &amp; C0/C1/C2 Shape Functions</text>
  <rect class="panel" x="20" y="44" width="380" height="256" rx="6"/>
  <text class="subtitle" x="34" y="66">1. Symplectic P2G → Grid → G2P Cycle (APIC / FLIP)</text>
  <rect x="45" y="86" width="155" height="58" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text class="subtitle" x="55" y="104">1. P2G Scatter</text>
  <text class="small" x="55" y="120">m_i = ∑ N_ip m_p</text>
  <text class="small" x="55" y="134">(mv)_i = ∑ N_ip m_p (v_p + B_p Δx)</text>
  <rect x="220" y="86" width="160" height="58" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text class="subtitle" x="230" y="104">2. Grid Forces &amp; BCs</text>
  <text class="small" x="230" y="120">f_i = f_ext - ∑ V_p σ_p ∇N_ip</text>
  <text class="small" x="230" y="134">Bardenhagen Contact</text>
  <rect x="220" y="174" width="160" height="58" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text class="subtitle" x="230" y="192">3. Grid Leapfrog</text>
  <text class="small" x="230" y="208">v_i^{n+1/2} = v_i + (f_i/m_i) Δt</text>
  <text class="small" x="230" y="222">m_i &lt; 1e-8 m_ref Guard</text>
  <rect x="45" y="174" width="155" height="58" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
  <text class="subtitle" x="55" y="192">4. G2P &amp; Stress</text>
  <text class="small" x="55" y="208">v_p, B_p, F_p^{n+1}, Cayley R</text>
  <text class="small" x="55" y="222">Constitutive Return Map</text>
  <line x1="200" y1="115" x2="218" y2="115" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="300" y1="144" x2="300" y2="172" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="220" y1="203" x2="202" y2="203" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="122" y1="174" x2="122" y2="146" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="mono" x="34" y="266">Initial-Contact Tie: v_a + B_a(x_b - x_a) == v_b</text>
  <text class="mono" x="34" y="284">J = max(1e-4, det(F)) | 8×8×8 Sparse Brick Tiles</text>
  <rect class="panel" x="420" y="44" width="380" height="256" rx="6"/>
  <text class="subtitle" x="434" y="66">2. 1D Basis Functions N(ξ) (ξ = (x - x_i)/h)</text>
  <line class="axis" x1="445" y1="248" x2="778" y2="248" marker-end="url(#arrow)"/>
  <line class="axis" x1="610" y1="248" x2="610" y2="85" marker-end="url(#arrow)"/>
  <line class="grid" x1="454" y1="90" x2="454" y2="248"/>
  <text class="small" x="450" y="262">-2</text>
  <line class="grid" x1="532" y1="90" x2="532" y2="248"/>
  <text class="small" x="528" y="262">-1</text>
  <line class="grid" x1="610" y1="90" x2="610" y2="248"/>
  <text class="small" x="606" y="262">0</text>
  <line class="grid" x1="688" y1="90" x2="688" y2="248"/>
  <text class="small" x="684" y="262">1</text>
  <line class="grid" x1="766" y1="90" x2="766" y2="248"/>
  <text class="small" x="762" y="262">2</text>
