  <line x1="440" y1="115" x2="462" y2="115" stroke="#2563eb" stroke-width="2.2"/>
  <text class="small" x="468" y="119">P+(M) (5th-order, α=3/16)</text>
  <line x1="440" y1="133" x2="462" y2="133" stroke="#dc2626" stroke-width="2.2"/>
  <text class="small" x="468" y="137">M+(M) (4th-order, β=1/8)</text>
  <text class="mono" x="436" y="286">Harten Entropy Fix applied if λ_L &lt; 0 &lt; λ_R</text>
</svg>
