<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="820" height="320" role="img" aria-label="Riemann Wave Fan and AUSM+ Splitting Schematic">
  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .title { font: 700 15px "Segoe UI", system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 600 12px "Segoe UI", system-ui, sans-serif; fill: #334155; }
      .label { font: 500 11px "Segoe UI", system-ui, sans-serif; fill: #1e293b; }
      .small { font: 400 10px "Segoe UI", system-ui, sans-serif; fill: #475569; }
      .mono { font: 500 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0f172a; }
      .axis { stroke: #334155; stroke-width: 1.2; }
      .grid { stroke: #e2e8f0; stroke-width: 0.8; stroke-dasharray: 3 3; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect class="bg" x="1" y="1" width="818" height="318" rx="8"/>

  <text class="title" x="24" y="28">Eulerian Interface Fluxes: Riemann Wave-Fan vs. AUSM+ Mach/Pressure Splitting</text>
  <rect class="panel" x="20" y="44" width="380" height="256" rx="6"/>
  <text class="subtitle" x="34" y="66">1. Compressible Riemann Wave-Fan (x - t Plane)</text>
  <line class="axis" x1="50" y1="255" x2="380" y2="255" marker-end="url(#arrow)"/>
  <line class="axis" x1="215" y1="255" x2="215" y2="85" marker-end="url(#arrow)"/>
  <text class="label" x="368" y="272">x</text>
  <text class="label" x="223" y="92">t</text>
  <line x1="215" y1="255" x2="85" y2="110" stroke="#2563eb" stroke-width="2.2"/>
  <line x1="215" y1="255" x2="265" y2="105" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 3"/>
  <line x1="215" y1="255" x2="345" y2="115" stroke="#dc2626" stroke-width="2.5"/>
  <text class="label" x="75" y="205">State W_L</text>
  <text class="small" x="68" y="220">(ρ_L, u_L, p_L, α_kL)</text>
  <text class="label" x="305" y="205">State W_R</text>
  <text class="small" x="295" y="220">(ρ_R, u_R, p_R, α_kR)</text>
  <text class="label" x="150" y="135" fill="#2563eb">W_L*</text>
  <text class="label" x="262" y="135" fill="#dc2626">W_R*</text>
  <text class="small" x="62" y="102" fill="#2563eb">S_L = u_L - c_L</text>
  <text class="small" x="235" y="98" fill="#16a34a">S_* (Contact)</text>
  <text class="small" x="315" y="108" fill="#dc2626">S_R = u_R + c_R</text>
  <text class="mono" x="38" y="286">Rusanov: s_max = max(|u_L|+c_L, |u_R|+c_R)</text>
  <rect class="panel" x="420" y="44" width="380" height="256" rx="6"/>
  <text class="subtitle" x="434" y="66">2. AUSM+ Split Mach M±(M) &amp; Pressure P±(M)</text>
